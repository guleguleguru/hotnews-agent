name: Daily HotNews Digest

on:
  # 定时执行：每天 12:00 UTC（北京时间 20:00）
  schedule:
    - cron: '0 12 * * *'
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run HotNews Agent (Real News)
        env:
          # OpenAI 配置（用于评分、改写、摘要）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          
          # 邮件配置
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          
          # 过滤和推送配置
          SCORE_THRESHOLD: ${{ secrets.SCORE_THRESHOLD }}
          TOPK: ${{ secrets.TOPK }}
          MAX_ITEMS: ${{ secrets.MAX_ITEMS }}
          MODEL_TIMEOUT: 30
          
          # SMTP 重试配置
          SMTP_MAX_RETRIES: 3
          SMTP_RETRY_DELAY: 2
          
          # 去重配置
          ENABLE_DEDUP: true
          HISTORY_DB_PATH: ./history/sent_news.db
          
          # 时区
          TIMEZONE: America/New_York
        run: |
          cd extensions/hotnews-agent
          python run_daily.py --real
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotnews-logs-${{ github.run_id }}
          path: extensions/hotnews-agent/logs/
          retention-days: 7

